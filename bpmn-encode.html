<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Semantic Process Mediator - Publisher</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.panel{
    max-width:700px;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    margin-top:0;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:5px;
    font-weight:bold;
}

input[type=text]{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}

button{
    margin-top:25px;
    padding:10px 20px;
    cursor:pointer;
}

#status{
    margin-top:20px;
    color:#0066aa;
}
</style>

</head>

<body>

<div class="panel">

<h1>Semantic Process Mediator Publisher</h1>

<label>BPMN file</label>

<input
    id="file"
    type="file"
    accept=".bpmn,.xml"
/>

<label>Publication title</label>

<input
    id="title"
    type="text"
    placeholder="Process title"
/>

<button id="generate">
Generate publication
</button>

<div id="status"></div>

</div>

<script>

const fileInput=document.getElementById("file");
const titleInput=document.getElementById("title");
const status=document.getElementById("status");

document
.getElementById("generate")
.addEventListener("click",generate);

async function generate(){

    const file=fileInput.files[0];

    if(!file){
        alert("Select a BPMN file.");
        return;
    }

    status.innerHTML="Reading BPMN...";

    const xml=await file.text();

    let title=titleInput.value.trim();

    if(title===""){
        title=file.name.replace(/\.(bpmn|xml)$/i,"");
    }

    status.innerHTML="Loading template...";

    const response=await fetch("viewer-template.html");

    if(!response.ok){
        alert("viewer-template.html not found");
        return;
    }

    let template=await response.text();

    /*
        Escape backticks because the template
        will contain:

        const EMBEDDED_BPMN=`...`;
    */

    const escapedXml=xml.replace(/`/g,"\\`");

    template=template.replace(
        "__TITLE__",
        title
    );

    template=template.replace(
        "__BPMN_XML__",
        escapedXml
    );

    const blob=new Blob(
        [template],
        {
            type:"text/html"
        }
    );

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download=
        title.replace(/[^\w\-]+/g,"_")+
        ".html";

    a.click();

    URL.revokeObjectURL(a.href);

    status.innerHTML="Publication generated.";

}

</script>

</body>
</html>
